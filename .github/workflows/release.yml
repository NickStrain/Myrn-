# Release: push a tag `vX.Y.Z` that matches the workspace version.
#
# 1. build:   one native runner per target, release build, smoke test, archive.
# 2. release: checksums, install scripts and package manifests (Homebrew,
#             Scoop, winget, npm) rendered for this version, and a GitHub release.
# 3. publish: npm, crates.io and the Homebrew tap, each only when its secret
#             is set (NPM_TOKEN, CARGO_REGISTRY_TOKEN, HOMEBREW_TAP_TOKEN).
#
# See docs/releasing.md.
name: release
on:
  push:
    tags: ["v*"]
  # Run by hand to build and render everything without publishing (no tag, no release).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-15-intel,   archive: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-latest,     archive: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   archive: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm,   archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # Native musl-gcc for the C parts (SQLite, libgit2, Tree-sitter grammars).
          t=$(echo '${{ matrix.target }}' | tr '-' '_')
          echo "CC_${t}=musl-gcc" >> "$GITHUB_ENV"
          echo "CFLAGS_${t}=-O2" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked -p myrn --target ${{ matrix.target }}
      - name: smoke test
        shell: bash
        run: |
          set -eux
          bin="$PWD/target/${{ matrix.target }}/release/myrn"
          "$bin" --version
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q repo && cd repo
          git config user.email ci@example.invalid && git config user.name ci
          printf 'def chunked(it, n):\n    return [it]\n' > more.py
          git add -A && git commit -qm first
          MYRN_HOME="$tmp/home" "$bin" init
          MYRN_HOME="$tmp/home" "$bin" status
          MYRN_HOME="$tmp/home" "$bin" explain chunked
      - name: archive
        shell: bash
        run: |
          set -eux
          name="myrn-${{ matrix.target }}"
          mkdir -p out stage
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/myrn.exe" stage/
            cp LICENSE README.md stage/
            (cd stage && 7z a -tzip "../out/$name.zip" . > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/myrn" stage/
            cp LICENSE README.md stage/
            tar -C stage -czf "out/$name.tar.gz" .
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: build-*
          merge-multiple: true
      - name: checksums and manifests
        run: |
          set -eux
          cd assets
          sha256sum myrn-* > sha256sums.txt
          cat sha256sums.txt
          cd ..
          python3 dist/render.py --version "${{ steps.version.outputs.version }}" \
            --sums assets/sha256sums.txt --repo "${GITHUB_REPOSITORY}" --out rendered
          cp scripts/install.sh scripts/install.ps1 assets/
          cp rendered/scoop/myrn.json assets/myrn.json
          cp rendered/homebrew/myrn.rb assets/myrn.rb
          (cd rendered && zip -qr ../assets/winget-manifests.zip winget)
          ls -l assets rendered/*
      - uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: rendered
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --title "myrn ${{ steps.version.outputs.version }}" --generate-notes --verify-tag

  npm:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rendered
          path: rendered
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm"; exit 0; fi
          cd rendered/npm
          npm publish --access public

  crates:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io"; exit 0; fi
          # Dependencies first; the benchmark is never published.
          cargo publish --locked --workspace --exclude myrn-bench

  homebrew:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rendered
          path: rendered
      - name: update the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-tap', github.repository_owner) }}
        run: |
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping the tap"; exit 0; fi
          git clone "https://x-access-token:${TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp rendered/homebrew/myrn.rb tap/Formula/myrn.rb
          cd tap
          git config user.name "myrn release" && git config user.email "actions@users.noreply.github.com"
          git add Formula/myrn.rb
          git commit -m "myrn ${{ needs.release.outputs.version }}" || exit 0
          git push
