[package]
name = "myrn-embed"
description = "Optional embedding helper: a CPU embedding model, started on first use, exits when idle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["model"]
# The static embedding model (Model2Vec): tokenizer, weights and the download.
# Without it the client always answers "unavailable" and nothing else changes.
model = [
    "dep:tokenizers",
    "dep:safetensors",
    "dep:ureq",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
safetensors = { version = "0.6", optional = true }
ureq = { version = "3", optional = true }
# Transformer (BERT-family) embedding models, run on the CPU in pure Rust.
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }

[dev-dependencies]
tempfile.workspace = true
