<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myrn</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --hover: rgba(11,11,11,0.05);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --link: rgba(82,81,78,0.28);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #a9a79f;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --hover: rgba(255,255,255,0.06);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --link: rgba(195,194,183,0.22);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --other: #5f5e59; --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --hover: rgba(255,255,255,0.06);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --link: rgba(195,194,183,0.22);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --other: #5f5e59; --good-text: #0ca30c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

header.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: 0.2px; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); }
nav.tabs a:hover { background: var(--hover); text-decoration: none; }
nav.tabs a.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.search { position: relative; }
.search input { width: 260px; max-width: 60vw; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--page); }
.results { position: absolute; right: 0; top: 36px; width: 380px; max-width: 90vw; max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 20; }
.results div { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.results div:hover, .results div.on { background: var(--hover); }
.iconbtn { border: 1px solid var(--border); background: var(--page); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.iconbtn:hover { background: var(--hover); }

main { flex: 1; display: flex; min-height: 0; }
#view { flex: 1; min-width: 0; overflow: auto; position: relative; }
#view.full { overflow: hidden; display: flex; flex-direction: column; }
aside#panel { overflow-x: hidden; width: 420px; max-width: 45vw; border-left: 1px solid var(--border); background: var(--surface); overflow: auto; padding: 16px; position: relative; }
aside#panel[hidden] { display: none; }
@media (max-width: 760px) { aside#panel { position: fixed; inset: auto 0 0 0; width: auto; max-width: none; height: 55vh; border-left: 0; border-top: 1px solid var(--border); z-index: 15; } }
.close { position: absolute; top: 10px; right: 10px; }

.page { padding: 20px 24px; max-width: 1200px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 24px 0 10px; }
h3 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.4px; }
.sub { color: var(--ink-2); margin: 0 0 16px; }
.muted { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 600; }
.tile .k { color: var(--ink-2); font-size: 12.5px; }
.tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.card h2 { margin-top: 0; }

.bars .row { display: grid; grid-template-columns: 110px 1fr 56px; gap: 10px; align-items: center; margin: 5px 0; }
.bars .track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.bars .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

.seg { display: flex; height: 28px; gap: 2px; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
.seg div { min-width: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend button { background: none; border: 0; padding: 2px 4px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.legend button:hover { background: var(--hover); }
.legend button.off { opacity: 0.4; text-decoration: line-through; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid currentColor; flex: none; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; }

.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.toolbar select, .toolbar input[type=text] { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--page); }
.canvaswrap { flex: 1; position: relative; min-height: 300px; background: var(--surface); }
.canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.canvaswrap canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
.count { position: absolute; right: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; position: sticky; top: 0; background: var(--page); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.on { background: var(--surface-2); }
.clip { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tree { padding: 8px 0; }
.tree .node > .line { display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.tree .node > .line:hover { background: var(--hover); }
.tree .node > .line.on { background: var(--surface-2); }
.tree .kids { margin-left: 18px; border-left: 1px solid var(--grid); padding-left: 4px; }
.tree .caret { width: 12px; color: var(--muted); flex: none; text-align: center; }
.tree .name { white-space: nowrap; }
.tree .sum { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; font-size: 13px; }
.kind { color: var(--muted); font-size: 11.5px; }

.banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-left: 4px solid var(--serious); background: var(--surface); padding: 10px 14px; border-radius: 8px; margin: 0 0 16px; }

.panel h2 { margin: 0 32px 4px 0; font-size: 16px; word-break: break-word; }
.panel .meta { color: var(--ink-2); font-size: 12.5px; margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel pre { background: var(--surface-2); padding: 10px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
.panel ul.links { list-style: none; padding: 0; margin: 0; }
.panel ul.links li { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.panel ul.links li a, .panel ul.links li > span:not(.rel) { overflow-wrap: anywhere; min-width: 0; }
.panel .rel { color: var(--muted); font-size: 12px; min-width: 76px; }
.panel .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.md p { margin: 0 0 8px; }
.md h1, .md h2, .md h3 { font-size: 14px; margin: 12px 0 6px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.md ul { margin: 0 0 8px; padding-left: 18px; }
.md code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }

.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 30; max-width: 360px; }
.tip .t2 { color: var(--ink-2); }
.empty { padding: 40px; color: var(--ink-2); text-align: center; }
.err { color: var(--critical); padding: 20px; white-space: pre-wrap; }
svg text { fill: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">myrn<small id="proj"></small></div>
  <nav class="tabs" id="tabs">
    <a data-v="overview">Overview</a>
    <a data-v="map">Project map</a>
    <a data-v="code">Code graph</a>
    <a data-v="notes">Notes graph</a>
    <a data-v="records">Records</a>
    <a data-v="sessions">Sessions</a>
  </nav>
  <div class="spacer"></div>
  <div class="search"><input id="q" type="search" placeholder="Find a symbol, file or record…" autocomplete="off"><div class="results" id="results" hidden></div></div>
  <button class="iconbtn" id="reload" title="Reload data">Reload</button>
  <button class="iconbtn" id="theme" title="Switch light / dark">Theme</button>
</header>
<main>
  <section id="view"></section>
  <aside id="panel" class="panel" hidden></aside>
</main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const cache = new Map();
async function api(path, fresh) {
  if (!fresh && cache.has(path)) return cache.get(path);
  const p = fetch("/api/" + path, { headers: { "X-Myrn-Token": TOKEN } }).then(async r => {
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  });
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}

// ---------------------------------------------------------------- DOM helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = (s, el = document) => el.querySelector(s);
// replaceChildren, skipping empty slots (optional pieces written as `cond ? el : null`).
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k != null && k !== false)); }
const fmt = n => (n ?? 0).toLocaleString();
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function clip(s, n) { s = (s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function firstSentence(s) { s = (s || "").replace(/\s+/g, " ").trim(); const i = s.search(/\.\s/); return i > 0 ? s.slice(0, i + 1) : s; }
function date(t) { if (!t) return ""; const d = new Date(t * 1000); return d.toISOString().slice(0, 10); }
function datetime(t) { if (!t) return ""; const d = new Date(t * 1000); return d.toISOString().slice(0, 16).replace("T", " "); }
function ago(t) {
  if (!t) return "never";
  const s = Date.now() / 1000 - t;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}

const STATUS = {
  verified: ["var(--good)", "verified"], unverified: ["var(--muted)", "unverified"],
  suspect: ["var(--warning)", "suspect"], superseded: ["var(--axis)", "superseded"],
  fresh: ["var(--good)", "fresh"], stale: ["var(--warning)", "stale"], missing: ["var(--axis)", "missing"],
  tests_passed: ["var(--good)", "tests passed"], tests_failed: ["var(--critical)", "tests failed"],
  committed: ["var(--s1)", "committed"], edited: ["var(--muted)", "edited"], no_changes: ["var(--axis)", "no changes"],
};
function pill(state) {
  const [c, label] = STATUS[state] || ["var(--muted)", state || "—"];
  return h("span", { class: "pill" }, h("span", { class: "dot", style: `background:${c}` }), label);
}

// Small Markdown: headings, lists, paragraphs, `code`, **bold**, [[wikilinks]].
function inline(text, onLink) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[\[[^\]]+\]\])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (m[1]) frag.append(h("code", { text: t.slice(1, -1) }));
    else if (m[2]) frag.append(h("strong", { text: t.slice(2, -2) }));
    else {
      const target = t.slice(2, -2).split("|")[0].split("#")[0].trim();
      frag.append(onLink ? h("a", { onclick: () => onLink(target), text: t.slice(2, -2).split("|").pop() }) : t);
    }
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function markdown(src, onLink) {
  const root = h("div", { class: "md" });
  let list = null, para = [];
  const flush = () => { if (para.length) { root.append(h("p", {}, inline(para.join(" "), onLink))); para = []; } };
  for (const raw of (src || "").split("\n")) {
    const line = raw.trimEnd();
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    const lm = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
    if (hm) { flush(); list = null; root.append(h("h3", {}, inline(hm[2], onLink))); }
    else if (lm) { flush(); if (!list) { list = h("ul"); root.append(list); } list.append(h("li", {}, inline(lm[1], onLink))); }
    else if (!line.trim()) { flush(); list = null; }
    else { list = null; para.push(line.trim()); }
  }
  flush();
  return root;
}

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
function showTip(x, y, ...lines) {
  fill(tip, ...lines.map((l, i) => h("div", { class: i ? "t2" : "" }, l)));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - r.height - 8) + "px";
}
function hideTip() { tip.hidden = true; }

// ---------------------------------------------------------------- force graph
// A force-directed graph on canvas: Barnes-Hut repulsion, springs on links,
// gentle centring. Drag nodes, drag to pan, wheel to zoom, hover to light up
// a node's neighbours (as Obsidian does), click to select, double-click to open.
class ForceGraph {
  constructor(host, opts) {
    this.o = Object.assign({ color: () => "var(--s1)", hollow: () => false, onSelect() {}, onOpen() {}, linkDist: 34, charge: -60, labels: "auto" }, opts);
    this.canvas = h("canvas");
    host.append(this.canvas);
    this.ctx = this.canvas.getContext("2d");
    this.nodes = []; this.links = []; this.byId = new Map();
    this.k = 1; this.tx = 0; this.ty = 0; this.alpha = 0; this.userMoved = false;
    this.hover = null; this.selected = null; this.hidden = () => false;
    this.colors = new Map();
    this.resize();
    this.ro = new ResizeObserver(() => { this.resize(); this.draw(); });
    this.ro.observe(host);
    this.bind();
    this.running = false;
  }
  destroy() { this.ro.disconnect(); this.dead = true; }
  resize() {
    const r = this.canvas.getBoundingClientRect();
    this.w = Math.max(1, r.width); this.hgt = Math.max(1, r.height);
    this.dpr = window.devicePixelRatio || 1;
    this.canvas.width = this.w * this.dpr; this.canvas.height = this.hgt * this.dpr;
    if (!this.userMoved && this.nodes.length) this.fit();
  }
  setData(nodes, links) {
    const prev = this.byId;
    this.byId = new Map();
    nodes.forEach((n, i) => {
      const old = prev.get(n.id);
      const a = i * 2.399963, r = 12 * Math.sqrt(i + 0.5);
      n.x = old ? old.x : r * Math.cos(a); n.y = old ? old.y : r * Math.sin(a);
      n.vx = 0; n.vy = 0; n.deg = 0; n.nb = new Set();
      this.byId.set(n.id, n);
    });
    this.links = [];
    for (const l of links) {
      const s = this.byId.get(l.s), t = this.byId.get(l.t);
      if (!s || !t || s === t) continue;
      this.links.push({ s, t, rel: l.rel, w: l.w || 1 });
      s.deg++; t.deg++; s.nb.add(t); t.nb.add(s);
    }
    for (const n of nodes) n.r = (n.big ? 4 : 2.6) + Math.sqrt(n.deg) * 1.25;
    this.nodes = nodes;
    this.userMoved = false; this.fitted = false;
    this.reheat(1);
  }
  visible(n) { return !this.hidden(n); }
  reheat(a) { this.alpha = Math.max(this.alpha, a); if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); } }
  loop() {
    if (this.dead) return;
    const ticks = this.nodes.length > 1200 ? 2 : 3;
    for (let i = 0; i < ticks && this.alpha > 0.003; i++) this.tick();
    if (!this.userMoved) this.fit(); // follow the layout until the user takes over
    this.draw();
    if (this.alpha > 0.003 || this.drag) requestAnimationFrame(() => this.loop());
    else { this.running = false; if (!this.userMoved) { this.fit(); this.draw(); } }
  }
  tick() {
    const nodes = this.nodes.filter(n => this.visible(n)), alpha = this.alpha;
    // Barnes-Hut repulsion.
    const tree = quadtree(nodes);
    const theta2 = 0.81, charge = this.o.charge;
    for (const n of nodes) applyCharge(tree, n, charge * alpha, theta2);
    // Springs.
    for (const l of this.links) {
      if (!this.visible(l.s) || !this.visible(l.t)) continue;
      const s = l.s, t = l.t;
      let dx = t.x + t.vx - s.x - s.vx, dy = t.y + t.vy - s.y - s.vy;
      let d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      const str = 0.7 / Math.min(s.deg, t.deg);
      const f = (d - this.o.linkDist) / d * alpha * str;
      dx *= f; dy *= f;
      const b = s.deg / (s.deg + t.deg);
      t.vx -= dx * b; t.vy -= dy * b; s.vx += dx * (1 - b); s.vy += dy * (1 - b);
    }
    // Centring, then move.
    for (const n of nodes) {
      const pull = n.deg ? 0.012 : 0.06; // unlinked nodes stay near, not adrift
      n.vx -= n.x * pull * alpha; n.vy -= n.y * pull * alpha;
      if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
      n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy;
    }
    this.alpha += (0 - this.alpha) * 0.02;
  }
  fit() {
    const vis = this.nodes.filter(n => this.visible(n));
    if (!vis.length) return;
    // Fit the bulk of the graph: a few stray nodes should not shrink the rest.

  openPanel(loading());

    const d = await api("node?id=" + encodeURIComponent(id));

    const parts = [h("h2", { text: title })];

      if (n.status) meta.append(pill(n.status));

    } else if (d.note_file) {

      const act = h("div", { class: "actions" },

    h("p", { class: "sub" }, "Recorded agent sessions: what they worked on, what Myrn gave them, and what they used."),
    h("div", { class: "tiles" },
      h("div", { class: "tile" }, h("div", { class: "v" }, fmt(ss.length)), h("div", { class: "k" }, "sessions")),
      h("div", { class: "tile" }, h("div", { class: "v" }, fmt(passed)), h("div", { class: "k" }, "ended with tests passing")),
      h("div", { class: "tile" }, h("div", { class: "v" }, fmt(inj)), h("div", { class: "k" }, "items injected")),
      h("div", { class: "tile" }, h("div", { class: "v" }, inj ? Math.round(used / inj * 100) + "%" : "—"), h("div", { class: "k" }, "of injected items used"))),
    h("div", { class: "card", style: "margin:16px 0" }, h("h2", {}, "Sessions per day"), chart),
    h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Started"), h("th", {}, "Agent"), h("th", {}, "Task"), h("th", {}, "Outcome"), h("th", {}, "What happened"),
      h("th", { class: "num" }, "Injected"), h("th", { class: "num" }, "Used"))),
      h("tbody", {}, ss.map(s => {
        const tr = h("tr", {}, h("td", { class: "mono" }, datetime(s.started)), h("td", {}, s.agent), h("td", { class: "clip", title: s.task || "" }, clip(s.task || "—", 80)),
          h("td", {}, pill(s.outcome)), h("td", { class: "clip muted" }, s.summary), h("td", { class: "num" }, fmt(s.injected)), h("td", { class: "num" }, fmt(s.used)));
        tr.addEventListener("click", () => { if (selRow) selRow.classList.remove("on"); selRow = tr; tr.classList.add("on"); showSession(s.session); });
        return tr;
      }))));
  return { deselect() { if (selRow) selRow.classList.remove("on"); } };
};

// One-series bar chart (SVG) with hover tooltips.
function barChart(points) {
  const W = 760, H = 180, padL = 30, padB = 24, padT = 8;
  const max = Math.max(1, ...points.map(p => p.value));
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", "100%"); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Sessions per day");
  const el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); svg.append(e); return e; };
  const ticks = max <= 4 ? max : 4;
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round(max * i / ticks), y = H - padB - (H - padB - padT) * v / max;
    el("line", { x1: padL, x2: W, y1: y, y2: y, stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 });
    el("text", { x: padL - 6, y: y + 4, "text-anchor": "end" }).textContent = v;
  }
  const n = points.length, slot = (W - padL) / Math.max(n, 1), bw = Math.min(28, slot - 2);
  points.forEach((p, i) => {
    const x = padL + i * slot + (slot - bw) / 2, hgt = (H - padB - padT) * p.value / max, y = H - padB - hgt;
    const r = Math.min(4, bw / 2, hgt);
    el("path", { d: `M${x},${H - padB}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${H - padB}Z`, fill: "var(--s1)" });
    const hit = el("rect", { x: padL + i * slot, y: padT, width: slot, height: H - padB - padT, fill: "transparent" });
    hit.addEventListener("mousemove", e => {
      const oc = {}; p.items.forEach(s => oc[s.outcome] = (oc[s.outcome] || 0) + 1);
      showTip(e.clientX, e.clientY, `${p.label}: ${p.value} session${p.value === 1 ? "" : "s"}`, Object.entries(oc).map(([k, v]) => `${STATUS[k] ? STATUS[k][1] : k} ${v}`).join(" · "));
    });
    hit.addEventListener("mouseleave", hideTip);
    if (n <= 12 || i === 0 || i === n - 1 || i % Math.ceil(n / 8) === 0) el("text", { x: padL + i * slot + slot / 2, y: H - 6, "text-anchor": "middle" }).textContent = p.label.slice(5);
  });
  return svg;
}

// ---------------------------------------------------------------- routing
function parseHash() {
  const [v, qs] = location.hash.slice(1).split("?");
  return { v: views[v] ? v : "overview", params: Object.fromEntries(new URLSearchParams(qs || "")) };
}
function setHash(v, params) {
  const clean = Object.fromEntries(Object.entries(params || {}).filter(([, x]) => x != null && x !== ""));
  const qs = new URLSearchParams(clean).toString();
  history.replaceState(null, "", location.pathname + location.search + "#" + v + (qs ? "?" + qs : ""));
}
function go(v, params) {
  const clean = Object.fromEntries(Object.entries(params || {}).filter(([, x]) => x != null && x !== ""));
  const qs = new URLSearchParams(clean).toString();
  location.hash = v + (qs ? "?" + qs : "");
}
async function route() {
  const { v, params } = parseHash();
  for (const a of document.querySelectorAll("#tabs a")) a.classList.toggle("on", a.dataset.v === v);
  if (current && current.graph) current.graph.destroy();
  current = null;
  hideTip();
  if (!params.focus) panel.hidden = true;
  try { const r = await views[v](params); if (r) current = r; }
  catch (e) { view.className = ""; fill(view, h("div", { class: "page" }, errorBox(e))); }
}
for (const a of document.querySelectorAll("#tabs a")) a.addEventListener("click", () => go(a.dataset.v));
addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePanel(); results.hidden = true; } if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); qIn.focus(); } });

// ---------------------------------------------------------------- search
const qIn = $("#q"), results = $("#results");
let st, active = -1;
qIn.addEventListener("input", () => {
  clearTimeout(st);
  const q = qIn.value.trim();
  if (!q) { results.hidden = true; return; }
  st = setTimeout(async () => {
    const hits = await api("search?q=" + encodeURIComponent(q), true).catch(() => []);
    active = -1;
    fill(results, ...(hits.length ? hits.map(x => {
      const d = h("div", {}, h("span", {}, x.label), h("span", { class: "kind" }, TYPE_LABEL[x.type] || x.type), h("span", { class: "muted mono", style: "margin-left:auto" }, clip(x.location, 40)));
      d.addEventListener("click", () => pickHit(x));
      return d;
    }) : [h("div", { class: "muted" }, "No match")]));
    results.hidden = false;
  }, 180);
});
qIn.addEventListener("keydown", e => {
  const items = [...results.children];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, Math.min(items.length - 1, active + (e.key === "ArrowDown" ? 1 : -1))); items.forEach((x, i) => x.classList.toggle("on", i === active)); }
  if (e.key === "Enter" && items[Math.max(0, active)]) items[Math.max(0, active)].click();
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });
function pickHit(x) {
  results.hidden = true;
  if (current && current.graph && current.graph.select(x.id)) { showDetails(x.id); return; }
  showDetails(x.id);
}

// ---------------------------------------------------------------- theme, reload
function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { t ? localStorage.setItem("myrn-theme", t) : localStorage.removeItem("myrn-theme"); } catch (_) {}
  if (current && current.graph) current.graph.themeChanged();
}
try { const t = localStorage.getItem("myrn-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark ? "light" : "dark");
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (current && current.graph) current.graph.themeChanged(); });
$("#reload").addEventListener("click", () => { cache.clear(); route(); });

if (!TOKEN) fill(view, h("div", { class: "page" }, errorBox(new Error("Open the URL that `myrn ui` printed (it carries an access token)."))));
else { api("overview").then(s => { $("#proj").textContent = s.root; }).catch(() => {}); route(); }
</script>
