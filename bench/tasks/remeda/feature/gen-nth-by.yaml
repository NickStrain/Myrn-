    +++ a/packages/remeda/src/nthBy.test.ts
    @@ -0,0 +1,116 @@
    +import { describe, expect, test } from "vitest";
    +import { identity } from "./identity";
    +import { nthBy } from "./nthBy";
    +import { pipe } from "./pipe";
    +
    +describe("runtime (dataFirst)", () => {
    +  test("works", () => {
    +    const data = [2, 1, 3];
    +
    +    expect(nthBy(data, 0, identity())).toBe(1);
    +    expect(nthBy(data, 1, identity())).toBe(2);
    +    expect(nthBy(data, 2, identity())).toBe(3);
    +  });
    +
    +  test("handles negative indexes", () => {
    +    const data = [2, 1, 3];
    +
    +    expect(nthBy(data, -1, identity())).toBe(3);
    +    expect(nthBy(data, -2, identity())).toBe(2);
    +    expect(nthBy(data, -3, identity())).toBe(1);
    +  });
    +
    +  test("handles overflows gracefully", () => {
    +    expect(nthBy([1, 2, 3], 100, identity())).toBeUndefined();
    +    expect(nthBy([1, 2, 3], -100, identity())).toBeUndefined();
    +  });
    +
    +  test("works with complex order rules", () => {
    +    const data = ["aaaa", "b", "bb", "a", "aaa", "bbbb", "aa", "bbb"] as const;
    +
    +    expect(nthBy(data, 0, (a) => a.length, identity())).toBe("a");
    +    expect(nthBy(data, 1, (a) => a.length, identity())).toBe("b");
    +    expect(nthBy(data, 2, (a) => a.length, identity())).toBe("aa");
    +    expect(nthBy(data, 3, (a) => a.length, identity())).toBe("bb");
    +    expect(nthBy(data, 4, (a) => a.length, identity())).toBe("aaa");
    +    expect(nthBy(data, 5, (a) => a.length, identity())).toBe("bbb");
    +    expect(nthBy(data, 6, (a) => a.length, identity())).toBe("aaaa");
    +    expect(nthBy(data, 7, (a) => a.length, identity())).toBe("bbbb");
    +  });
    +});
    +
    +describe("runtime (dataLast)", () => {
    +  test("works", () => {
    +    const data = [2, 1, 3];
    +
    +    expect(pipe(data, nthBy(0, identity()))).toBe(1);
    +    expect(pipe(data, nthBy(1, identity()))).toBe(2);
    +    expect(pipe(data, nthBy(2, identity()))).toBe(3);
    +  });
    +
    +  test("handles negative indexes", () => {
    +    const data = [2, 1, 3];
    +
    +    expect(pipe(data, nthBy(-1, identity()))).toBe(3);
    +    expect(pipe(data, nthBy(-2, identity()))).toBe(2);
    +    expect(pipe(data, nthBy(-3, identity()))).toBe(1);
    +  });
    +
    +  test("handles overflows gracefully", () => {
    +    expect(pipe([1, 2, 3], nthBy(100, identity()))).toBeUndefined();
    +    expect(pipe([1, 2, 3], nthBy(-100, identity()))).toBeUndefined();
    +  });
    +
    +  test("works with complex order rules", () => {
    +    const data = ["aaaa", "b", "bb", "a", "aaa", "bbbb", "aa", "bbb"] as const;
    +
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(0, (a) => a.length, identity()),
    +      ),
    +    ).toBe("a");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(1, (a) => a.length, identity()),
    +      ),
    +    ).toBe("b");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(2, (a) => a.length, identity()),
    +      ),
    +    ).toBe("aa");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(3, (a) => a.length, identity()),
    +      ),
    +    ).toBe("bb");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(4, (a) => a.length, identity()),
    +      ),
    +    ).toBe("aaa");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(5, (a) => a.length, identity()),
    +      ),
    +    ).toBe("bbb");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(6, (a) => a.length, identity()),
    +      ),
    +    ).toBe("aaaa");
    +    expect(
    +      pipe(
    +        data,
    +        nthBy(7, (a) => a.length, identity()),
    +      ),
    +    ).toBe("bbbb");
    +  });
    +});
    diff --git b/packages/remeda/src/nthBy.ts a/packages/remeda/src/nthBy.ts
    new file mode 100644
    index 0000000..c6ec4e3
    --- /dev/null
    +++ a/packages/remeda/src/nthBy.ts
    @@ -0,0 +1,65 @@
    +import {
    +  purryOrderRulesWithArgument,
    +  type OrderRules,
    +} from "./internal/purryOrderRules";
    +import { quickSelect } from "./internal/quickSelect";
    +import type { CompareFunction } from "./internal/types/CompareFunction";
    +import type { IterableContainer } from "./internal/types/IterableContainer";
    +
    +/**
    + * Retrieves the element that would be at the given index if the array were sorted according to specified rules. This function uses the *QuickSelect* algorithm running at an average complexity of *O(n)*. Semantically it is equivalent to `sortBy(data, ...rules).at(index)` which would run at *O(nlogn)*.
    + *
    + * See also `firstBy` which provides an even more efficient algorithm and a stricter return type, but only for `index === 0`. See `takeFirstBy` to get all the elements up to and including `index`.
    + *
    + * @param data - The input array.
    + * @param index - The zero-based index for selecting the element in the sorted order. Negative indices count backwards from the end.
    + * @param rules - A variadic array of order rules defining the sorting criteria. Each order rule is a projection function that extracts a comparable value from the data. Sorting is based on these extracted values using the native `<` and `>` operators. Earlier rules take precedence over later ones. Use the syntax `[projection, "desc"]` for descending order.
    + * @returns The element at the specified index in the sorted order, or `undefined` if the index is out of bounds.
    + * @signature
    + *   nthBy(data, index, ...rules);
    + * @example
    + *   nthBy([2,1,4,5,3,], 2, identity()); // => 3
    + * @dataFirst
    + * @category Array
    + */
    +export function nthBy<T extends IterableContainer>(
    +  data: T,
    +  index: number,
    +  ...rules: OrderRules<T[number]>
    +): T[number] | undefined;
    +
    +/**
    + * Retrieves the element that would be at the given index if the array were sorted according to specified rules. This function uses the *QuickSelect* algorithm running at an average complexity of *O(n)*. Semantically it is equivalent to `sortBy(data, ...rules)[index]` which would run at *O(nlogn)*.
    + *
    + * See also `firstBy` which provides an even more efficient algorithm and a stricter return type, but only for `index === 0`. See `takeFirstBy` to get all the elements up to and including `index`.
    + *
    + * @param index - The zero-based index for selecting the element in the sorted order. Negative indices count backwards from the end.
    + * @param rules - A variadic array of order rules defining the sorting criteria. Each order rule is a projection function that extracts a comparable value from the data. Sorting is based on these extracted values using the native `<` and `>` operators. Earlier rules take precedence over later ones. Use the syntax `[projection, "desc"]` for descending order.
    + * @returns The element at the specified index in the sorted order, or `undefined` if the index is out of bounds.
    + * @signature
    + *   nthBy(index, ...rules)(data);
    + * @example
    + *   pipe([2,1,4,5,3,], nthBy(2, identity())); // => 3
    + * @dataLast
    + * @category Array
    + */
    +export function nthBy<T extends IterableContainer>(
    +  index: number,
    +  ...rules: OrderRules<T[number]>
    +): (data: T) => T[number] | undefined;
    +
    +export function nthBy(...args: readonly unknown[]): unknown {
    +  return purryOrderRulesWithArgument(nthByImplementation, args);
    +}
    +
    +const nthByImplementation = <T>(
    +  data: readonly T[],
    +  compareFn: CompareFunction<T>,
    +  index: number,
    +): T | undefined =>
    +  quickSelect(
    +    data,
    +    // Allow negative indices gracefully
    +    index >= 0 ? index : data.length + index,
    +    compareFn,
    +  );
check:
