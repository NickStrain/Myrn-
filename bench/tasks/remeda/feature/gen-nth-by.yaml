          expect(nthBy(data, 4, (a) => a.length, identity())).toBe("aaa");
          expect(nthBy(data, 5, (a) => a.length, identity())).toBe("bbb");
          expect(nthBy(data, 6, (a) => a.length, identity())).toBe("aaaa");
          expect(nthBy(data, 7, (a) => a.length, identity())).toBe("bbbb");
