id: remeda/feature/gen-only
repo: remeda
kind: feature
prompt: |
    Add a utility `only` to remeda in `packages/remeda/src/only.ts`, exported from the
    package index like the other utilities, with the calling styles and types its
    documentation shows. Its documentation:

        Returns the first and only element of `data`, or undefined otherwise.

        @param data - The target array.
        @signature
           only(data)
        @example
           only([]) // => undefined
           only([1]) // => 1
           only([1, 2]) // => undefined
        @dataFirst
        @category Array

        Returns the first and only element of `data`, or undefined otherwise.

        @signature
           only()(data)
        @example
           pipe([], only()); // => undefined
           pipe([1], only()); // => 1
           pipe([1, 2], only()); // => undefined
        @dataLast
        @category Array

    npm dependencies are not installed and there is no network access. Node 24 is
    available and can run TypeScript files directly.
