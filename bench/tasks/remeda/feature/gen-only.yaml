    +import { describe, expect, test } from "vitest";
    +import { filter } from "./filter";
    +import { only } from "./only";
    +import { pipe } from "./pipe";
    +
    +describe("dataFirst", () => {
    +  test("empty array", () => {
    +    expect(only([])).toBeUndefined();
    +  });
    +
    +  test("length 1 array", () => {
    +    expect(only([1])).toBe(1);
    +  });
    +
    +  test("length 2 array", () => {
    +    expect(only([1, 2])).toBeUndefined();
    +  });
    +
    +  test("length 3 array", () => {
    +    expect(only([1, 2, 3])).toBeUndefined();
    +  });
    +
    +  test("returns the item itself", () => {
    +    const item = { a: 1 };
    +
    +    expect(only([item])).toBe(item);
    +  });
    +
    +  test("a NaN item", () => {
    +    expect(only([NaN])).toBeNaN();
    +  });
    +
    +  test("a -0 item", () => {
    +    expect(only([-0])).toBe(-0);
    +  });
    +
    +  test("an undefined first item still counts", () => {
    +    expect(only([undefined, 1])).toBeUndefined();
    +  });
    +});
    +
    +describe("data last", () => {
    +  test("empty array", () => {
    +    expect(pipe([], only())).toBeUndefined();
    +  });
    +
    +  test("length 1 array", () => {
    +    expect(pipe([1], only())).toBe(1);
    +  });
    +
    +  test("length 2 array", () => {
    +    expect(pipe([1, 2], only())).toBeUndefined();
    +  });
    +
    +  test("length 3 array", () => {
    +    expect(pipe([1, 2, 3], only())).toBeUndefined();
    +  });
    +
    +  test("an undefined first item still counts", () => {
    +    expect(pipe([undefined, 1], only())).toBeUndefined();
    +  });
    +
    +  test("counts only the items that reach it", () => {
    +    expect(
    +      pipe(
    +        [1, 2, 3],
    +        filter((x) => x > 2),
    +        only(),
    +      ),
    +    ).toBe(3);
    +  });
    +});
    +
    +test("simple tuple", () => {
    +  expect(only([1, "a"])).toBeUndefined();
    +});
    +
    +test("tuple with last", () => {
    +  expect(only(["a", 1])).toBeUndefined();
    +});
    +
    +test("tuple with two last", () => {
    +  expect(only(["a", 1, 2])).toBeUndefined();
    +});
    +
    +test("tuple with first and last", () => {
    +  expect(only([1, "a", 2])).toBeUndefined();
    +});
    diff --git b/packages/remeda/src/only.ts a/packages/remeda/src/only.ts
    new file mode 100644
    index 0000000..86792d4
    --- /dev/null
    +++ a/packages/remeda/src/only.ts
    @@ -0,0 +1,48 @@
    +import { purry1 } from "./internal/purryByArity";
    +import type { IterableContainer } from "./internal/types/IterableContainer";
    +
    +type Only<T extends IterableContainer> = T extends
    +  | readonly [...unknown[], unknown, unknown]
    +  | readonly []
    +  | readonly [unknown, ...unknown[], unknown]
    +  | readonly [unknown, unknown, ...unknown[]]
    +  ? undefined
    +  : T extends readonly [unknown]
    +    ? T[number]
    +    : T[number] | undefined;
    +
    +/**
    + * Returns the first and only element of `data`, or undefined otherwise.
    + *
    + * @param data - The target array.
    + * @signature
    + *    only(data)
    + * @example
    + *    only([]) // => undefined
    + *    only([1]) // => 1
    + *    only([1, 2]) // => undefined
    + * @dataFirst
    + * @category Array
    + */
    +export function only<T extends IterableContainer>(data: T): Only<T>;
    +
    +/**
    + * Returns the first and only element of `data`, or undefined otherwise.
    + *
    + * @signature
    + *    only()(data)
    + * @example
    + *    pipe([], only()); // => undefined
    + *    pipe([1], only()); // => 1
    + *    pipe([1, 2], only()); // => undefined
    + * @dataLast
    + * @category Array
    + */
    +export function only<T extends IterableContainer>(): (data: T) => Only<T>;
    +
    +export function only(data?: IterableContainer): unknown {
    +  return purry1(onlyImplementation, arguments.length, data);
    +}
    +
    +const onlyImplementation = <T>(data: readonly T[]): T | undefined =>
    +  data.length === 1 ? data[0] : undefined;
check:
