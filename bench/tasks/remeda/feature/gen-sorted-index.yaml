    +++ a/packages/remeda/src/sortedIndex.test.ts
    @@ -0,0 +1,67 @@
    +import { describe, expect, test } from "vitest";
    +import { pipe } from "./pipe";
    +import { sortedIndex } from "./sortedIndex";
    +
    +test("empty array", () => {
    +  expect(sortedIndex([], 1)).toBe(0);
    +});
    +
    +describe("array with single item", () => {
    +  test("item smaller than item in array", () => {
    +    expect(sortedIndex([2], 1)).toBe(0);
    +  });
    +
    +  test("item larger than item in array", () => {
    +    expect(sortedIndex([0], 1)).toBe(1);
    +  });
    +
    +  test("item in array", () => {
    +    expect(sortedIndex([1], 1)).toBe(0);
    +  });
    +});
    +
    +describe("array with multiple values", () => {
    +  test("item smaller than all items in array", () => {
    +    expect(sortedIndex([1, 2, 3, 4, 5], 0)).toBe(0);
    +  });
    +
    +  test("item larger than all items in array", () => {
    +    expect(sortedIndex([1, 2, 3, 4, 5], 6)).toBe(5);
    +  });
    +
    +  test("item in array", () => {
    +    expect(sortedIndex([1, 2, 3, 4, 5], 3)).toBe(2);
    +  });
    +});
    +
    +describe("array with duplicates", () => {
    +  test("item smaller than all items in array", () => {
    +    expect(sortedIndex([1, 1, 1, 1, 1], 0)).toBe(0);
    +  });
    +
    +  test("item larger than all items in array", () => {
    +    expect(sortedIndex([1, 1, 1, 1, 1], 2)).toBe(5);
    +  });
    +
    +  test("item in array", () => {
    +    expect(sortedIndex([1, 1, 1, 1, 1], 1)).toBe(0);
    +  });
    +});
    +
    +describe("string array", () => {
    +  test("item smaller than all items in array", () => {
    +    expect(sortedIndex(["a", "b", "c", "d", "e"], " ")).toBe(0);
    +  });
    +
    +  test("item larger than all items in array", () => {
    +    expect(sortedIndex(["a", "b", "c", "d", "e"], "z")).toBe(5);
    +  });
    +
    +  test("item in array", () => {
    +    expect(sortedIndex(["a", "b", "c", "d", "e"], "c")).toBe(2);
    +  });
    +});
    +
    +test("data-last", () => {
    +  expect(pipe([1, 3], sortedIndex(2))).toBe(1);
    +});
    diff --git b/packages/remeda/src/sortedIndex.ts a/packages/remeda/src/sortedIndex.ts
    new file mode 100644
    index 0000000..d8dfa87
    --- /dev/null
    +++ a/packages/remeda/src/sortedIndex.ts
    @@ -0,0 +1,61 @@
    +import { binarySearchCutoffIndex } from "./internal/binarySearchCutoffIndex";
    +import { purry2 } from "./internal/purryByArity";
    +
    +/**
    + * Find the insertion position (index) of an item in an array with items sorted
    + * in ascending order; so that `splice(sortedIndex, 0, item)` would result in
    + * maintaining the array's sort-ness. The array can contain duplicates.
    + * If the item already exists in the array the index would be of the *first*
    + * occurrence of the item.
    + *
    + * Runs in O(logN) time.
    + *
    + * @param data - The (ascending) sorted array.
    + * @param item - The item to insert.
    + * @returns Insertion index (In the range 0..array.length).
    + * @signature
    + *    sortedIndex(data, item)
    + * @example
    + *    sortedIndex(['a','a','b','c','c'], 'c') // => 3
    + * @dataFirst
    + * @category Array
    + * @see sortedIndexBy, sortedIndexWith, sortedLastIndex, sortedLastIndexBy
    + */
    +export function sortedIndex<T>(data: readonly T[], item: T): number;
    +
    +/**
    + * Find the insertion position (index) of an item in an array with items sorted
    + * in ascending order; so that `splice(sortedIndex, 0, item)` would result in
    + * maintaining the array's sort-ness. The array can contain duplicates.
    + * If the item already exists in the array the index would be of the *first*
    + * occurrence of the item.
    + *
    + * Runs in O(logN) time.
    + *
    + * @param item - The item to insert.
    + * @returns Insertion index (In the range 0..array.length).
    + * @signature
    + *    sortedIndex(item)(data)
    + * @example
    + *    pipe(['a','a','b','c','c'], sortedIndex('c')) // => 3
    + * @dataLast
    + * @category Array
    + * @see sortedIndexBy, sortedIndexWith, sortedLastIndex, sortedLastIndexBy
    + */
    +export function sortedIndex<T = never>(
    +  // We first try to infer T through the callback to allow the type to be pulled
    +  // from the call site it is used in (like `pipe`).
    +  item: NoInfer<T>,
    +): (data: readonly T[]) => number;
    +
    +export function sortedIndex<T>(
    +  // Otherwise we allow T to be inferred directly from the operand.
    +  item: T,
    +): (data: readonly NoInfer<T>[]) => number;
    +
    +export function sortedIndex(dataOrItem: unknown, item?: unknown): unknown {
    +  return purry2(sortedIndexImplementation, arguments.length, dataOrItem, item);
    +}
    +
    +const sortedIndexImplementation = <T>(data: readonly T[], item: T): number =>
    +  binarySearchCutoffIndex(data, (pivot) => pivot < item);
check:
  files:
    packages/remeda/test/bench-loader.mjs: |
      // Resolve remeda's extensionless relative imports to .ts files, and `vitest`
      // to a small stand-in, so Node 24 runs the tests without npm install.
      import { registerHooks } from "node:module";

      const shim = new URL("./vitest-shim.mjs", import.meta.url).href;
      registerHooks({
        resolve(specifier, context, nextResolve) {
          if (specifier === "vitest") return { url: shim, shortCircuit: true };
          try {
            return nextResolve(specifier, context);
          } catch (error) {
            if (!specifier.startsWith(".")) throw error;
            try {
              return nextResolve(`${specifier}.ts`, context);
            } catch {
              return nextResolve(`${specifier}/index.ts`, context);
            }
          }
        },
      });
    packages/remeda/test/vitest-shim.mjs: |
      // The part of vitest's API remeda's simple tests use, on node:test.
      import assert from "node:assert/strict";
      import { describe as nodeDescribe, test as nodeTest } from "node:test";

      export const describe = (name, fn) => nodeDescribe(name, fn);
      export const test = (name, fn) => nodeTest(name, fn);
      export const it = test;

      const deep = (a, b, strict) => {
        try {
          (strict ? assert.deepStrictEqual : assert.deepEqual)(a, b);
          return true;
        } catch {
          return false;
        }
      };

      function matchers(actual, negate) {
        const check = (ok, what) => {
          if (negate ? ok : !ok) {
            throw new assert.AssertionError({ message: `expected ${negate ? "not " : ""}${what}`, actual });
          }
        };
        const throws = (expected) => {
          let threw = false;
          let error;
          try {
            actual();
          } catch (e) {
            threw = true;
            error = e;
          }
          const ok =
            threw &&
            (expected === undefined ||
              (typeof expected === "string" && String(error?.message).includes(expected)) ||
              (expected instanceof RegExp && expected.test(String(error?.message))) ||
              (typeof expected === "function" && error instanceof expected) ||
              (typeof expected === "object" && expected !== null && !(expected instanceof RegExp) && String(error?.message) === String(expected.message)));
          check(ok, "to throw");
        };
        return {
          toBe: (e) => check(Object.is(actual, e), `${String(actual)} to be ${String(e)}`),
          toStrictEqual: (e) => check(deep(actual, e, true), "strict equality"),
          toEqual: (e) => check(deep(actual, e, false), "equality"),
          toHaveLength: (n) => check(actual?.length === n, `length ${n}`),
          toBeUndefined: () => check(actual === undefined, "undefined"),
          toBeNull: () => check(actual === null, "null"),
          toBeTruthy: () => check(Boolean(actual), "truthy"),
          toBeFalsy: () => check(!actual, "falsy"),
          toBeNaN: () => check(Number.isNaN(actual), "NaN"),
          toBeLessThan: (n) => check(actual < n, `< ${n}`),
          toBeLessThanOrEqual: (n) => check(actual <= n, `<= ${n}`),
          toBeGreaterThan: (n) => check(actual > n, `> ${n}`),
          toBeGreaterThanOrEqual: (n) => check(actual >= n, `>= ${n}`),
          toContain: (x) => check(actual.includes(x), "to contain"),
          toBeTypeOf: (t) => check(typeof actual === t, `type ${t}`),
          toThrow: throws,
          toThrowError: throws,
        };
      }

      export function expect(actual) {
        const m = matchers(actual, false);
        m.not = matchers(actual, true);
        return m;
      }
    packages/remeda/src/bench-check.test.ts: |
      import { describe, expect, test } from "vitest";
      import { pipe } from "./pipe";
      import { sortedIndex } from "./sortedIndex";

      test("empty array", () => {
