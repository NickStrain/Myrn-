id: remeda/feature/gen-sorted-index
repo: remeda
kind: feature
prompt: |
    Add a utility `sortedIndex` to remeda in `packages/remeda/src/sortedIndex.ts`, exported from the
    package index like the other utilities, with the calling styles and types its
    documentation shows. Its documentation:

        Find the insertion position (index) of an item in an array with items sorted
        in ascending order; so that `splice(sortedIndex, 0, item)` would result in
        maintaining the array's sort-ness. The array can contain duplicates.
        If the item already exists in the array the index would be of the *first*
        occurrence of the item.

        Runs in O(logN) time.

        @param data - The (ascending) sorted array.
        @param item - The item to insert.
        @returns Insertion index (In the range 0..array.length).
        @signature
           sortedIndex(data, item)
        @example
           sortedIndex(['a','a','b','c','c'], 'c') // => 3
        @dataFirst
        @category Array
        @see sortedIndexBy, sortedIndexWith, sortedLastIndex, sortedLastIndexBy

        Find the insertion position (index) of an item in an array with items sorted
        in ascending order; so that `splice(sortedIndex, 0, item)` would result in
        maintaining the array's sort-ness. The array can contain duplicates.
        If the item already exists in the array the index would be of the *first*
        occurrence of the item.

        Runs in O(logN) time.

        @param item - The item to insert.
        @returns Insertion index (In the range 0..array.length).
        @signature
           sortedIndex(item)(data)
        @example
           pipe(['a','a','b','c','c'], sortedIndex('c')) // => 3
        @dataLast
        @category Array
        @see sortedIndexBy, sortedIndexWith, sortedLastIndex, sortedLastIndexBy

    npm dependencies are not installed and there is no network access. Node 24 is
    available and can run TypeScript files directly.
