solution:
  patch: |
    diff --git b/packages/remeda/src/index.ts a/packages/remeda/src/index.ts
    index cf9ee2d..ed5b86a 100644
    --- b/packages/remeda/src/index.ts
    +++ a/packages/remeda/src/index.ts
    @@ -130,6 +130,7 @@ export * from "./sortedLastIndex";
     export * from "./sortedLastIndexBy";
     export * from "./splice";
     export * from "./split";
    +export * from "./splitAt";
     export * from "./splitWhen";
     export * from "./startsWith";
     export * from "./stringToPath";
