id: remeda/feature/gen-take-last
repo: remeda
kind: feature
prompt: |
    Add a utility `takeLast` to remeda in `packages/remeda/src/takeLast.ts`, exported from the
    package index like the other utilities, with the calling styles and types its
    documentation shows. Its documentation:

        Takes the last `n` elements from `data`.

        Related operations:
        - `dropLast` - to skip past the last `n` instead.
        - `splice` - to remove or insert at an arbitrary index.
        - `take` - same, but from the start of the array.

        @param data - The target array.
        @param n - The number of elements to take.
        @signature
           takeLast(data, n)
        @example
           takeLast([1, 2, 3, 4, 5], 2) // => [4, 5]
        @dataFirst
        @category Array

        Take the last `n` elements from `data`.

        Related operations:
        - `dropLast` - to skip past the last `n` instead.
        - `splice` - to remove or insert at an arbitrary index.
        - `take` - same, but from the start of the array.

        @param n - The number of elements to take.
        @signature
           takeLast(n)(data)
        @example
           takeLast(2)([1, 2, 3, 4, 5]) // => [4, 5]
        @dataLast
        @category Array

    npm dependencies are not installed and there is no network access. Node 24 is
    available and can run TypeScript files directly.
