  patch: |
    diff --git b/docs/api.rst a/docs/api.rst
    index dfafc52..7b40a8e 100644
    --- b/docs/api.rst
    +++ a/docs/api.rst
    @@ -332,6 +332,7 @@ The tools focus on math with integers.
 
     .. autofunction:: factor
