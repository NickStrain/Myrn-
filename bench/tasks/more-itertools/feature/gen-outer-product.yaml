    diff --git b/more_itertools/more.py a/more_itertools/more.py
    index 247954c..068ed68 100755
    --- b/more_itertools/more.py
    +++ a/more_itertools/more.py
    @@ -131,6 +131,7 @@ __all__ = [
         'numeric_range',
         'one',
         'only',
    +    'outer_product',
