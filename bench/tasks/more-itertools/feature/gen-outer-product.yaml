      from __future__ import annotations

      import cmath
      import gc
      import platform
      import types
      import weakref

      from collections import Counter, deque
      from collections.abc import Set, Sequence, Iterable, Iterator, Hashable
      from datetime import datetime, timedelta
      from decimal import Decimal
      from doctest import DocTestSuite
      from fractions import Fraction
      from functools import partial, reduce
      from io import StringIO
      from itertools import (
          accumulate,
          chain,
          combinations,
          combinations_with_replacement,
          count,
          cycle,
          groupby,
          islice,
          permutations,
          product,
          repeat,
      )
      from math import factorial
      from operator import add, mul, itemgetter, not_
      from pickle import loads, dumps
      from random import Random, choices, random, randrange, seed
      from statistics import mean, median
      from string import ascii_letters
      from threading import Event, Thread, Lock
      from time import sleep
      from typing import NamedTuple
      from unittest import TestCase, mock, skipUnless

      import more_itertools as mi


      class OuterProductTests(TestCase):
          def test_basic(self) -> None:
              greetings = ['Hello', 'Goodbye']
              names = ['Alice', 'Bob', 'Carol']
              greet = lambda greeting, name: f'{greeting}, {name}!'
              result = list(mi.outer_product(greet, greetings, names))
              expected = [
                  ('Hello, Alice!', 'Hello, Bob!', 'Hello, Carol!'),
                  ('Goodbye, Alice!', 'Goodbye, Bob!', 'Goodbye, Carol!'),
              ]
              self.assertEqual(result, expected)
