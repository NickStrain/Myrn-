check:
  files:
    tests/test_bench_check.py: |
      from __future__ import annotations

      import cmath
      import gc
      import platform
      import types
      import weakref

      from collections import Counter, deque
      from collections.abc import Set, Sequence, Iterable, Iterator, Hashable
      from datetime import datetime, timedelta
      from decimal import Decimal
      from doctest import DocTestSuite
      from fractions import Fraction
      from functools import partial, reduce
      from io import StringIO
      from itertools import (
          accumulate,
          chain,
          combinations,
          combinations_with_replacement,
          count,
          cycle,
          groupby,
          islice,
          permutations,
          product,
          repeat,
      )
      from math import factorial
      from operator import add, mul, itemgetter, not_
      from pickle import loads, dumps
      from random import Random, choices, random, randrange, seed
      from statistics import mean, median
      from string import ascii_letters
      from threading import Event, Thread, Lock
      from time import sleep
      from typing import NamedTuple
      from unittest import TestCase, mock, skipUnless

      import more_itertools as mi


      class TakewhileInclusiveTests(TestCase):
          def test_basic(self) -> None:
              result = list(mi.takewhile_inclusive(lambda x: x < 5, [1, 4, 6, 4, 1]))
              expected = [1, 4, 6]
              self.assertEqual(result, expected)

          def test_empty_iterator(self) -> None:
              result = list(mi.takewhile_inclusive(lambda x: True, []))
              expected = []
              self.assertEqual(result, expected)

          def test_collatz_sequence(self) -> None:
              is_even = lambda n: n % 2 == 0
              start = 11
              result = list(
                  mi.takewhile_inclusive(
                      lambda n: n != 1,
                      mi.iterate(
                          lambda n: n // 2 if is_even(n) else 3 * n + 1, start
                      ),
                  )
              )
              expected = [11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1]
              self.assertEqual(result, expected)
  run: python3 -m unittest -q tests.test_bench_check
